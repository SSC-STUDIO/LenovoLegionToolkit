appId: com.universaldevicetoolkit.app
productName: Universal Device Toolkit
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
extraResources:
  - from: ../UniversalDeviceToolkit.Host/publish/win-x64
    to: host
    filter:
      - "**/*"
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Universal-Device-Toolkit-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Universal Device Toolkit
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.utilities
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
