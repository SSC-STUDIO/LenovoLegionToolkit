appId: com.universaldevicetoolkit.app
productName: Universal Device Toolkit
copyright: Universal Device Toolkit Contributors
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
extraResources:
  - from: ../UniversalDeviceToolkit.Host/publish/win-x64
    to: host
    filter:
      - "**/*"
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: UniversalDeviceToolkitSetup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Universal Device Toolkit
  uninstallDisplayName: Universal Device Toolkit
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  # Multilingual installer (matches the retired Inno Setup installer's 23 languages).
  multiLanguageInstaller: true
  installerLanguages:
    - en_US
    - zh_CN
    - zh_TW
    - ar
    - bg
    - cs
    - de
    - el_GR
    - es
    - fr
    - hu
    - it
    - ja
    - lv
    - pl
    - pt_BR
    - ro
    - ru
    - sk
    - tr
    - uk
    - vi
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.utilities
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/






