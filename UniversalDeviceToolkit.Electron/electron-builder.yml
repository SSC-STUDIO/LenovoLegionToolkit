appId: com.universaldevicetoolkit.app
productName: Universal Device Toolkit
copyright: Universal Device Toolkit Contributors
executableName: UniversalDeviceToolkit
directories:
  output: dist
  # Named buildResources (not build/) so Windows case-insensitive .gitignore
  # Build/ does not exclude the committed icon.ico / installer.nsh.
  buildResources: buildResources
files:
  - out/**
  - resources/**
  - package.json
compression: maximum
publish:
  provider: github
  owner: SSC-STUDIO
  repo: UniversalDeviceToolkit
win:
  icon: buildResources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: nsis-web
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: UniversalDeviceToolkitSetup-${version}.${ext}
  # Per-platform .NET Host payload. The Release workflow publishes a
  # self-contained runtime per RID into UniversalDeviceToolkit.Host/publish/<rid>;
  # a missing publish dir only warns and is skipped (appFileCopier.js).
  extraResources:
    - from: ../UniversalDeviceToolkit.Host/publish/win-x64
      to: host
      filter:
        - "**/*"
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Universal Device Toolkit
  uninstallDisplayName: Universal Device Toolkit
  deleteAppDataOnUninstall: false
  include: buildResources/installer.nsh
  # Multilingual installer (matches the retired Inno Setup installer's 23 languages).
  multiLanguageInstaller: true
  installerLanguages:
    - en_US
    - zh_CN
    - zh_TW
    - ar
    - bg
    - cs
    - de
    - el_GR
    - es
    - fr
    - hu
    - it
    - ja
    - lv
    - pl
    - pt_BR
    - ro
    - ru
    - sk
    - tr
    - uk
    - vi
  installerIcon: buildResources/icon.ico
  uninstallerIcon: buildResources/icon.ico
nsisWeb:
  artifactName: UniversalDeviceToolkitOnlineSetup-${version}.${ext}
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Universal Device Toolkit
  uninstallDisplayName: Universal Device Toolkit
  deleteAppDataOnUninstall: false
  include: buildResources/installer.nsh
  # nsisWeb inherits nsis options; keep the stub English-only so it stays <= 15MB.
  multiLanguageInstaller: false
  installerLanguages:
    - en_US
  installerIcon: buildResources/icon.ico
  uninstallerIcon: buildResources/icon.ico
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.utilities
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

