name: Language Online CI

# Phase A: Online-like WPF build + mock catalog install smoke on PRs/pushes.
on:
  push:
    branches: [ master ]
    paths:
      - 'UniversalDeviceToolkit.WPF/**'
      - 'UniversalDeviceToolkit.Lib/**'
      - 'Tools/LanguagePack*/**'
      - 'Scripts/Prune-ShippingFootprint.ps1'
      - 'Scripts/Run-LanguageOnlineCi.ps1'
      - 'Scripts/Assert-CultureNaming.ps1'
      - 'crowdin.yml'
      - 'Docs/LanguagePacks.md'
      - 'Docs/OnlineLanguageAndUpstreamAbsorptionPlan.md'
      - '.github/workflows/Language-Online-Ci.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'UniversalDeviceToolkit.WPF/**'
      - 'UniversalDeviceToolkit.Lib/**'
      - 'Tools/LanguagePack*/**'
      - 'Scripts/Prune-ShippingFootprint.ps1'
      - 'Scripts/Run-LanguageOnlineCi.ps1'
      - 'Scripts/Assert-CultureNaming.ps1'
      - 'crowdin.yml'
      - 'Docs/LanguagePacks.md'
      - 'Docs/OnlineLanguageAndUpstreamAbsorptionPlan.md'
      - '.github/workflows/Language-Online-Ci.yml'
  workflow_dispatch:

jobs:
  online-language-smoke:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}

      - name: Language gate exclusivity unit tests
        env:
          MSBUILDDISABLENODEREUSE: 1
        run: |
          dotnet test UniversalDeviceToolkit.Tests/UniversalDeviceToolkit.Tests.csproj `
            --configuration Release -p:Platform=x64 `
            --filter "FullyQualifiedName~PhaseALanguageAndBrandTests|FullyQualifiedName~PhaseBAutomationSafeStartTests|FullyQualifiedName~PhaseCSpecialKeyAndLightingTests" `
            --logger "trx;LogFileName=PhaseABCD.trx"

      - name: Online-like build + mock catalog install
        shell: pwsh
        run: |
          ./Scripts/Run-LanguageOnlineCi.ps1 -Configuration Release -Platform x64 -Culture de

      - name: Upload Phase A logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: language-online-ci
          path: |
            **/PhaseABCD.trx
            Tools/LanguagePackMockBackend/_serve/**
          if-no-files-found: warn
