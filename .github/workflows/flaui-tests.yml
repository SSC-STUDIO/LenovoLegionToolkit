# FlaUI Tests Workflow
# NOTE: FlaUI tests require a Windows desktop session and cannot run on GitHub-hosted runners.
# This workflow is for reference and local self-hosted runners with desktop access.

name: FlaUI Tests

on:
  workflow_dispatch:  # Manual trigger only
  push:
    branches: [ master ]
    paths:
      - 'UniversalDeviceToolkit.WPF/**'
      - 'UniversalDeviceToolkit.Tests/FlaUI/**'

jobs:
  flaui-tests:
    name: FlaUI UI Automation Tests
    runs-on: windows-latest  # Requires self-hosted runner with desktop session
    if: false  # Disabled - requires desktop session (https://github.com/actions/runner/issues/1510)

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Kill existing UDT processes
      run: |
        Get-Process -Name "Universal Device Toolkit" -ErrorAction SilentlyContinue | Stop-Process -Force
        Start-Sleep -Seconds 2
      shell: powershell

    - name: Build solution
      run: dotnet build UniversalDeviceToolkit.Tests/UniversalDeviceToolkit.Tests.csproj -c Debug
      shell: powershell

    - name: Run FlaUI tests
      run: |
        dotnet test UniversalDeviceToolkit.Tests/UniversalDeviceToolkit.Tests.csproj `
          --filter "FullyQualifiedName~FlaUI" `
          -c Debug `
          --no-build `
          -v n `
          -- NUnit.DisplayName=Full
      shell: powershell

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: flaui-test-results
        path: FlaUI_test_results.txt
        if-no-files-found: ignore

    - name: Upload screenshots on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: flaui-screenshots
        path: "**/FlaUI_*.png"
        if-no-files-found: ignore
