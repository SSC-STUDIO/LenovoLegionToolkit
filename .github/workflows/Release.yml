name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    permissions:
      contents: write
      pages: write
      id-token: write

    runs-on: windows-2022
    env:
      BUILD_OUTPUT: Build
      ONLINE_BUILD_OUTPUT: Build-English
      INSTALLER_OUTPUT: BuildInstaller
      RELEASE_OUTPUT: release-assets
      PAGES_OUTPUT: release-assets/pages

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Resolve release version
      shell: pwsh
      run: |
        [xml]$props = Get-Content -Raw 'Directory.Build.props'
        $group = $props.Project.PropertyGroup | Select-Object -First 1

        $releaseVersion = [string]$group.ReleaseVersion
        if ([string]::IsNullOrWhiteSpace($releaseVersion) -or $releaseVersion -match '\$\(') {
          $majorVersion = [string]$group.MajorVersion
          $minorVersion = [string]$group.MinorVersion
          $patchVersion = [string]$group.PatchVersion

          if ([string]::IsNullOrWhiteSpace($majorVersion) -or [string]::IsNullOrWhiteSpace($minorVersion) -or [string]::IsNullOrWhiteSpace($patchVersion)) {
            throw 'Could not resolve release version from Directory.Build.props.'
          }

          $releaseVersion = "$majorVersion.$minorVersion.$patchVersion"
        }

        $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
        if ($tagVersion -ne $releaseVersion) {
          throw "Git tag version '$tagVersion' does not match Directory.Build.props version '$releaseVersion'."
        }

        "VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "SETUP_FULL_ASSET=UniversalDeviceToolkit_v$releaseVersion" + "_Full_Setup.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "SETUP_ONLINE_ASSET=UniversalDeviceToolkit_v$releaseVersion" + "_Online_Setup.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "ZIP_FULL_ASSET=UniversalDeviceToolkit_v$releaseVersion" + "_Full_win-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "ZIP_ONLINE_ASSET=UniversalDeviceToolkit_v$releaseVersion" + "_Online_win-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "HASH_ASSET=UniversalDeviceToolkit_v$releaseVersion" + "_SHA256.txt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "LEGACY_SETUP_ASSET=LenovoLegionToolkit_v$releaseVersion" + "_Setup.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Restore solution
      run: dotnet restore LenovoLegionToolkit.sln

    - name: Build solution
      run: dotnet build LenovoLegionToolkit.sln --configuration Release --no-restore

    - name: Test solution
      run: dotnet test LenovoLegionToolkit.Tests/LenovoLegionToolkit.Tests.csproj --framework net10.0-windows10.0.26100.0 --configuration Release --no-build --logger "trx;LogFileName=LenovoLegionToolkit.Release.Tests.trx" --collect:"XPlat Code Coverage"

    - name: Publish release payload
      shell: pwsh
      run: |
        Remove-Item -Recurse -Force $env:BUILD_OUTPUT, $env:ONLINE_BUILD_OUTPUT, $env:INSTALLER_OUTPUT, $env:RELEASE_OUTPUT, $env:PAGES_OUTPUT -ErrorAction SilentlyContinue

        dotnet publish LenovoLegionToolkit.WPF/LenovoLegionToolkit.WPF.csproj --configuration Release --output $env:BUILD_OUTPUT /p:DebugType=None /p:FileVersion=$env:VERSION /p:Version=$env:VERSION
        if ($LASTEXITCODE -ne 0) { throw "WPF publish failed." }

        dotnet publish LenovoLegionToolkit.CLI/LenovoLegionToolkit.CLI.csproj --configuration Release --output $env:BUILD_OUTPUT /p:DebugType=None /p:FileVersion=$env:VERSION /p:Version=$env:VERSION
        if ($LASTEXITCODE -ne 0) { throw "CLI publish failed." }

        $prunePaths = @(
          (Join-Path $env:BUILD_OUTPUT 'x86'),
          (Join-Path $env:BUILD_OUTPUT 'arm64'),
          (Join-Path $env:BUILD_OUTPUT 'SpectrumTester.exe'),
          (Join-Path $env:BUILD_OUTPUT 'SpectrumTester.dll'),
          (Join-Path $env:BUILD_OUTPUT 'SpectrumTester.deps.json'),
          (Join-Path $env:BUILD_OUTPUT 'SpectrumTester.runtimeconfig.json')
        )

        foreach ($path in $prunePaths) {
          if (Test-Path $path) {
            Remove-Item -Recurse -Force $path
          }
        }

    - name: Smoke CLI help and version
      shell: pwsh
      run: |
        $cliExePath = Join-Path $PWD "$env:BUILD_OUTPUT\llt.exe"
        $cliDllPath = Join-Path $PWD "$env:BUILD_OUTPUT\llt.dll"
        if (-not (Test-Path $cliExePath)) {
          throw "CLI executable not found at $cliExePath"
        }
        if (-not (Test-Path $cliDllPath)) {
          throw "CLI assembly not found at $cliDllPath"
        }

        $help = (& dotnet $cliDllPath --help 2>&1 | Out-String).Trim()
        if ($LASTEXITCODE -ne 0) {
          throw "CLI help failed with exit code $LASTEXITCODE`n$help"
        }
        if ($help -notmatch 'Usage:' -or $help -notmatch 'Commands:') {
          throw "CLI help output missing expected sections.`n$help"
        }

        $version = (& dotnet $cliDllPath --version 2>&1 | Out-String).Trim()
        if ($LASTEXITCODE -ne 0) {
          throw "CLI version failed with exit code $LASTEXITCODE`n$version"
        }
        if (-not $version.StartsWith($env:VERSION)) {
          throw "CLI version '$version' does not start with expected '$env:VERSION'."
        }

    - name: Prepare release and Pages resources
      shell: pwsh
      run: |
        ./Scripts/Build-LanguageAssets.ps1 -BuildDir $env:BUILD_OUTPUT -OnlineBuildDir $env:ONLINE_BUILD_OUTPUT -ReleaseOutput $env:RELEASE_OUTPUT -PagesOutput $env:PAGES_OUTPUT -Version $env:VERSION -Repository '${{ github.repository }}'

    - name: Build installers
      shell: pwsh
      run: |
        iscc MakeInstaller.iss /DMyAppVersion=$env:VERSION /DMyAppSourceDir=$env:BUILD_OUTPUT /DMyAppOutputBaseFilename=UniversalDeviceToolkitSetup-Full
        if ($LASTEXITCODE -ne 0) {
          throw "Full Inno Setup build failed."
        }

        iscc MakeInstaller.iss /DMyAppVersion=$env:VERSION /DMyAppSourceDir=$env:ONLINE_BUILD_OUTPUT /DMyAppOutputBaseFilename=UniversalDeviceToolkitSetup-Online
        if ($LASTEXITCODE -ne 0) {
          throw "Online Inno Setup build failed."
        }

    - name: Finalize release assets
      shell: pwsh
      run: |
        ./Scripts/Build-LanguageAssets.ps1 `
          -FinalizeOnly `
          -ReleaseOutput $env:RELEASE_OUTPUT `
          -PagesOutput $env:PAGES_OUTPUT `
          -Version $env:VERSION `
          -FullInstallerPath "$env:INSTALLER_OUTPUT\UniversalDeviceToolkitSetup-Full.exe" `
          -OnlineInstallerPath "$env:INSTALLER_OUTPUT\UniversalDeviceToolkitSetup-Online.exe" `
          -Repository '${{ github.repository }}'

    - name: Generate release notes
      shell: pwsh
      run: |
        $assetNames = @(
          $env:SETUP_FULL_ASSET,
          $env:SETUP_ONLINE_ASSET,
          $env:ZIP_FULL_ASSET,
          $env:ZIP_ONLINE_ASSET,
          $env:LEGACY_SETUP_ASSET,
          $env:HASH_ASSET
        )

        ./Scripts/New-ReleaseNotes.ps1 `
          -Version $env:VERSION `
          -ChangelogPath 'CHANGELOG.md' `
          -AssetNames $assetNames `
          -ProductName 'Universal Device Toolkit' `
          -OutputPath (Join-Path $PWD "$env:RELEASE_OUTPUT\release-notes.md")

    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        name: Universal Device Toolkit v${{ env.VERSION }}
        body_path: release-assets/release-notes.md
        files: |
          release-assets/*.exe
          release-assets/*.zip
          release-assets/*_SHA256.txt
        fail_on_unmatched_files: true
        prerelease: ${{ contains(github.ref_name, '-') }}

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: release-assets/pages

    - name: Deploy Pages resources
      uses: actions/deploy-pages@v4

    - name: Upload release artifact
      uses: actions/upload-artifact@v7
      with:
        name: release-assets-v${{ env.VERSION }}
        path: release-assets/

    - name: Upload Pages resources artifact
      uses: actions/upload-artifact@v7
      with:
        name: pages-resources-v${{ env.VERSION }}
        path: release-assets/pages/
