name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    permissions:
      contents: write
      pages: write
      id-token: write

    runs-on: windows-2022
    env:
      BUILD_OUTPUT: Build
      ONLINE_BUILD_OUTPUT: Build-English
      INSTALLER_OUTPUT: BuildInstaller
      RELEASE_OUTPUT: release-assets
      PAGES_OUTPUT: release-assets/pages

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Checkout plugin repository
      uses: actions/checkout@v7
      with:
        repository: SSC-STUDIO/UniversalDeviceToolkit-Plugins
        path: UniversalDeviceToolkit-Plugins
        ref: master
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Resolve release version
      shell: pwsh
      run: |
        [xml]$props = Get-Content -Raw 'Directory.Build.props'
        $group = $props.Project.PropertyGroup | Select-Object -First 1

        $releaseVersion = [string]$group.ReleaseVersion
        if ([string]::IsNullOrWhiteSpace($releaseVersion) -or $releaseVersion -match '\$\(') {
          $majorVersion = [string]$group.MajorVersion
          $minorVersion = [string]$group.MinorVersion
          $patchVersion = [string]$group.PatchVersion

          if ([string]::IsNullOrWhiteSpace($majorVersion) -or [string]::IsNullOrWhiteSpace($minorVersion) -or [string]::IsNullOrWhiteSpace($patchVersion)) {
            throw 'Could not resolve release version from Directory.Build.props.'
          }

          $releaseVersion = "$majorVersion.$minorVersion.$patchVersion"
        }

        $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
        $normalizedTagVersion = if ($tagVersion -match '^(\d+\.\d+\.\d+)') { $Matches[1] } else { $tagVersion }
        if ($normalizedTagVersion -ne $releaseVersion) {
          throw "Git tag version '$tagVersion' does not match Directory.Build.props version '$releaseVersion'."
        }

        $versionLabel = if ($tagVersion -match '-') { $tagVersion } else { $releaseVersion }
        $majorVersionNumber = [int]($releaseVersion.Split('.')[0])
        $includeCrossPlatformCli = $majorVersionNumber -ge 5
        "VERSION=$versionLabel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "BUILD_VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "ENABLE_CROSS_PLATFORM_CLI=$($includeCrossPlatformCli.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "SETUP_FULL_ASSET=UniversalDeviceToolkit_v$versionLabel" + "_Full_Setup.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "SETUP_ONLINE_ASSET=UniversalDeviceToolkit_v$versionLabel" + "_Online_Setup.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "ZIP_FULL_ASSET=UniversalDeviceToolkit_v$versionLabel" + "_Full_win-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "ZIP_ONLINE_ASSET=UniversalDeviceToolkit_v$versionLabel" + "_Online_win-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        if ($includeCrossPlatformCli) {
          "CLI_CROSS_PLATFORM_ASSET=UniversalDeviceToolkit_v$versionLabel" + "_CLI_cross-platform.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        }
        "HASH_ASSET=UniversalDeviceToolkit_v$versionLabel" + "_SHA256.txt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "LEGACY_SETUP_ASSET=LenovoLegionToolkit_v$versionLabel" + "_Setup.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Restore solution
      run: dotnet restore UniversalDeviceToolkit.sln --locked-mode

    - name: Build release test project
      run: dotnet build UniversalDeviceToolkit.Tests/UniversalDeviceToolkit.Tests.csproj --framework net10.0-windows10.0.26100.0 --configuration Release --no-restore

    - name: Test solution
      run: dotnet test UniversalDeviceToolkit.Tests/UniversalDeviceToolkit.Tests.csproj --framework net10.0-windows10.0.26100.0 --configuration Release --no-build --logger "trx;LogFileName=UniversalDeviceToolkit.Release.Tests.trx" --collect:"XPlat Code Coverage"

    - name: Publish release payload
      shell: pwsh
      run: |
        Remove-Item -Recurse -Force $env:BUILD_OUTPUT, $env:ONLINE_BUILD_OUTPUT, $env:INSTALLER_OUTPUT, $env:RELEASE_OUTPUT, $env:PAGES_OUTPUT -ErrorAction SilentlyContinue

        dotnet publish UniversalDeviceToolkit.WPF/UniversalDeviceToolkit.WPF.csproj --configuration Release --output $env:BUILD_OUTPUT /p:DebugType=None /p:FileVersion=$env:BUILD_VERSION /p:Version=$env:BUILD_VERSION
        if ($LASTEXITCODE -ne 0) { throw "WPF publish failed." }

        dotnet publish UniversalDeviceToolkit.CLI/UniversalDeviceToolkit.CLI.csproj --configuration Release --output $env:BUILD_OUTPUT /p:DebugType=None /p:FileVersion=$env:BUILD_VERSION /p:Version=$env:BUILD_VERSION
        if ($LASTEXITCODE -ne 0) { throw "CLI publish failed." }

        dotnet publish UniversalDeviceToolkit.NetworkProxy/UniversalDeviceToolkit.NetworkProxy.csproj --configuration Release --output $env:BUILD_OUTPUT /p:DebugType=None /p:FileVersion=$env:BUILD_VERSION /p:Version=$env:BUILD_VERSION
        if ($LASTEXITCODE -ne 0) { throw "NetworkProxy publish failed." }

        $prunePaths = @(
          (Join-Path $env:BUILD_OUTPUT 'x86'),
          (Join-Path $env:BUILD_OUTPUT 'arm64')
        )

        foreach ($path in $prunePaths) {
          if (Test-Path $path) {
            Remove-Item -Recurse -Force $path
          }
        }

        ./Scripts/Prune-ShippingFootprint.ps1 -PayloadPath $env:BUILD_OUTPUT -AllowedCultures 'ar;bg;bs;ca;cs;de;el;en;es;fr;hu;it;ja;ko;lv;nl;nl-nl;no;pl;pt;pt-br;ro;ru;sk;tr;uk;uz;uz-latn-uz;vi;zh;zh-hans;zh-hant'
        ./Scripts/Build-PluginRuntimeAssets.ps1 `
          -PluginsRepositoryRoot "$env:GITHUB_WORKSPACE/UniversalDeviceToolkit-Plugins" `
          -HostSourceDir $env:BUILD_OUTPUT `
          -DestinationPath $env:BUILD_OUTPUT `
          -Configuration Release
        if ($LASTEXITCODE -ne 0) { throw "Plugin runtime staging failed." }
        ./Scripts/Assert-ShippingPayload.ps1 -PayloadPath $env:BUILD_OUTPUT

    - name: Smoke CLI help and version
      shell: pwsh
      run: |
        $cliExePath = Join-Path $PWD "$env:BUILD_OUTPUT\udt-cli.exe"
        $cliDllPath = Join-Path $PWD "$env:BUILD_OUTPUT\udt-cli.dll"
        if (-not (Test-Path $cliExePath)) {
          throw "CLI executable not found at $cliExePath"
        }
        if (-not (Test-Path $cliDllPath)) {
          throw "CLI assembly not found at $cliDllPath"
        }

        # One-release compatibility shim for scripts that still invoke llt.exe
        Copy-Item -LiteralPath $cliExePath -Destination (Join-Path $PWD "$env:BUILD_OUTPUT\llt.exe") -Force
        Copy-Item -LiteralPath $cliDllPath -Destination (Join-Path $PWD "$env:BUILD_OUTPUT\llt.dll") -Force

        $help = (& dotnet $cliDllPath --help 2>&1 | Out-String).Trim()
        if ($LASTEXITCODE -ne 0) {
          throw "CLI help failed with exit code $LASTEXITCODE`n$help"
        }
        if ($help -notmatch 'Usage:' -or $help -notmatch 'Commands:') {
          throw "CLI help output missing expected sections.`n$help"
        }

        $version = (& dotnet $cliDllPath --version 2>&1 | Out-String).Trim()
        if ($LASTEXITCODE -ne 0) {
          throw "CLI version failed with exit code $LASTEXITCODE`n$version"
        }
        if (-not $version.StartsWith($env:BUILD_VERSION)) {
          throw "CLI version '$version' does not start with expected '$env:BUILD_VERSION'."
        }

    - name: Prepare release and Pages resources
      shell: pwsh
      run: |
        ./Scripts/Build-LanguageAssets.ps1 -BuildDir $env:BUILD_OUTPUT -OnlineBuildDir $env:ONLINE_BUILD_OUTPUT -ReleaseOutput $env:RELEASE_OUTPUT -PagesOutput $env:PAGES_OUTPUT -Version $env:VERSION -Repository '${{ github.repository }}'
        ./Scripts/Assert-ShippingPayload.ps1 -PayloadPath $env:BUILD_OUTPUT
        ./Scripts/Assert-ShippingPayload.ps1 -PayloadPath $env:ONLINE_BUILD_OUTPUT

    - name: Build installers
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path $env:INSTALLER_OUTPUT -Force | Out-Null

        iscc /O"$env:INSTALLER_OUTPUT" /F"UniversalDeviceToolkitSetup-Full" MakeInstaller.iss /DMyAppVersion=$env:VERSION /DMyAppSourceDir="$env:BUILD_OUTPUT"
        if ($LASTEXITCODE -ne 0) {
          throw "Full Inno Setup build failed."
        }

        iscc /O"$env:INSTALLER_OUTPUT" /F"UniversalDeviceToolkitSetup-Online" MakeInstaller.iss /DMyAppVersion=$env:VERSION /DMyAppSourceDir="$env:ONLINE_BUILD_OUTPUT"
        if ($LASTEXITCODE -ne 0) {
          throw "Online Inno Setup build failed."
        }

        $expectedInstallerPaths = @(
          "$env:INSTALLER_OUTPUT\UniversalDeviceToolkitSetup-Full.exe",
          "$env:INSTALLER_OUTPUT\UniversalDeviceToolkitSetup-Online.exe"
        )

        Get-ChildItem -LiteralPath $env:INSTALLER_OUTPUT -Filter '*.exe' | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize
        foreach ($installerPath in $expectedInstallerPaths) {
          if (-not (Test-Path -LiteralPath $installerPath)) {
            throw "Expected installer output was not created: $installerPath"
          }
        }

    - name: Publish cross-platform CLI asset
      if: ${{ env.ENABLE_CROSS_PLATFORM_CLI == 'true' }}
      shell: pwsh
      run: |
        ./Scripts/Build-CrossPlatformCliAsset.ps1 `
          -Version $env:BUILD_VERSION `
          -AssetVersion $env:VERSION `
          -ReleaseOutput $env:RELEASE_OUTPUT `
          -SkipHashUpdate

    - name: Finalize release assets
      shell: pwsh
      run: |
        $finalizeArgs = @{
          FinalizeOnly = $true
          ReleaseOutput = $env:RELEASE_OUTPUT
          PagesOutput = $env:PAGES_OUTPUT
          Version = $env:VERSION
          FullInstallerPath = "$env:INSTALLER_OUTPUT\UniversalDeviceToolkitSetup-Full.exe"
          OnlineInstallerPath = "$env:INSTALLER_OUTPUT\UniversalDeviceToolkitSetup-Online.exe"
          Repository = '${{ github.repository }}'
        }

        if ($env:ENABLE_CROSS_PLATFORM_CLI -eq 'true') {
          $finalizeArgs['IncludeCrossPlatformCli'] = $true
        }

        ./Scripts/Build-LanguageAssets.ps1 @finalizeArgs

    - name: Validate package manifests
      if: ${{ !contains(github.ref_name, '-') }}
      shell: pwsh
      run: |
        $releaseDate = [DateTime]::UtcNow.ToString('yyyy-MM-dd', [System.Globalization.CultureInfo]::InvariantCulture)
        ./Packaging/Prepare-PackageManifests.ps1 `
          -Version $env:BUILD_VERSION `
          -ReleaseDate $releaseDate `
          -HashManifestPath "$env:RELEASE_OUTPUT\$env:HASH_ASSET" `
          -UpdatePublishedScoopManifest

        ./Packaging/Test-PackageManifests.ps1 `
          -Version $env:BUILD_VERSION `
          -Repository '${{ github.repository }}' `
          -HashManifestPath "$env:RELEASE_OUTPUT\$env:HASH_ASSET"

        if (Get-Command winget -ErrorAction SilentlyContinue) {
          winget validate "Packaging\winget\manifests\s\SSC-STUDIO\LenovoLegionToolkit\$env:BUILD_VERSION"
          if ($LASTEXITCODE -ne 0) {
            throw "winget manifest validation failed."
          }
        }
        else {
          Write-Warning "winget is not available on this runner; skipped winget schema validation."
        }

    - name: Generate release notes
      shell: pwsh
      run: |
        $assetNames = @(
          $env:SETUP_FULL_ASSET,
          $env:SETUP_ONLINE_ASSET,
          $env:ZIP_FULL_ASSET,
          $env:ZIP_ONLINE_ASSET,
          $env:LEGACY_SETUP_ASSET,
          $env:HASH_ASSET
        )
        if ($env:ENABLE_CROSS_PLATFORM_CLI -eq 'true') {
          $assetNames += $env:CLI_CROSS_PLATFORM_ASSET
        }

        ./Scripts/New-ReleaseNotes.ps1 `
          -Version $env:BUILD_VERSION `
          -ChangelogPath 'CHANGELOG.md' `
          -AssetNames $assetNames `
          -ProductName 'Universal Device Toolkit' `
          -OutputPath (Join-Path $PWD "$env:RELEASE_OUTPUT\release-notes.md")

    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        name: Universal Device Toolkit v${{ env.VERSION }}
        files: |
          release-assets/*.exe
          release-assets/*.zip
          release-assets/*_SHA256.txt
        fail_on_unmatched_files: true
        prerelease: ${{ contains(github.ref_name, '-') }}

    - name: Apply release notes (UTF-8)
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $notesPath = Join-Path $PWD "$env:RELEASE_OUTPUT/release-notes.md"
        if (-not (Test-Path -LiteralPath $notesPath)) {
          throw "Release notes file not found at $notesPath"
        }

        gh release edit "${{ github.ref_name }}" `
          --repo "${{ github.repository }}" `
          --notes-file $notesPath

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: release-assets/pages

    - name: Deploy Pages resources
      uses: actions/deploy-pages@v4

    - name: Upload release artifact
      uses: actions/upload-artifact@v7
      with:
        name: release-assets-v${{ env.VERSION }}
        path: release-assets/

    - name: Upload Pages resources artifact
      uses: actions/upload-artifact@v7
      with:
        name: pages-resources-v${{ env.VERSION }}
        path: release-assets/pages/
