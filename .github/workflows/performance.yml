name: Performance Benchmark

on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-benchmark:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}

      - name: Restore benchmark
        run: dotnet restore UniversalDeviceToolkit.PerformanceTest/UniversalDeviceToolkit.PerformanceTest.csproj --locked-mode

      - name: Build benchmark
        run: dotnet build UniversalDeviceToolkit.PerformanceTest/UniversalDeviceToolkit.PerformanceTest.csproj --configuration Release --no-restore

      - name: Run benchmark
        shell: pwsh
        run: |
          $benchmarkRoot = Join-Path $env:RUNNER_TEMP 'udt-performance'
          New-Item -ItemType Directory -Force -Path $benchmarkRoot | Out-Null
          $env:UDT_APPDATA_OVERRIDE = Join-Path $benchmarkRoot 'appdata'
          New-Item -ItemType Directory -Force -Path $env:UDT_APPDATA_OVERRIDE | Out-Null
          dotnet run --project UniversalDeviceToolkit.PerformanceTest/UniversalDeviceToolkit.PerformanceTest.csproj --configuration Release --no-build -- --output (Join-Path $benchmarkRoot 'PerformanceBenchmark.txt')

      - name: Upload benchmark report
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: performance-benchmark-${{ github.run_id }}
          path: ${{ runner.temp }}/udt-performance/PerformanceBenchmark.txt
          if-no-files-found: error
