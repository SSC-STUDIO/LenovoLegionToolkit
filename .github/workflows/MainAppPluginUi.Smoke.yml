name: Main App UI Smoke

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Optional predefined smoke scenario
        type: choice
        required: false
        default: custom
        options:
          - custom
          - shell-local
          - combo-local
          - driver-download
          - system-optimization
          - dashboard
          - power-mode
      plugin_ids:
        description: Comma-separated plugin ids
        required: false
        default: custom-mouse,shell-integration,vive-tool,network-acceleration
      plugin_sources:
        description: Comma-separated plugin install sources (<pluginId>=online|local)
        required: false
        default: '*=online'
      screenshot_mode:
        description: Screenshot capture policy
        type: choice
        required: false
        default: always
        options:
          - off
          - failures
          - always
      theme:
        description: App theme override for the smoke sandbox
        type: choice
        required: false
        default: dark
        options:
          - system
          - light
          - dark
      watch:
        description: Slow the smoke down so it is watchable on the dedicated UI runner desktop
        type: boolean
        required: false
        default: true
      step_delay_ms:
        description: Per-step observation delay in milliseconds when watch is enabled
        required: false
        default: '1200'
      success_hold_ms:
        description: Keep the main window open before success exit when watch is enabled
        required: false
        default: '5000'
      failure_hold_ms:
        description: Keep the failure state visible before exit when watch is enabled
        required: false
        default: '15000'
      keep_artifacts:
        description: Preserve smoke sandbox and local package bundle on the runner
        type: boolean
        required: false
        default: true
      power_mode_hardware_verify:
        description: For the power-mode scenario, perform real hardware write/readback verification and restore the original mode
        type: boolean
        required: false
        default: false

concurrency:
  group: main-app-ui-smoke
  cancel-in-progress: false

jobs:
  ui-smoke:
    runs-on: [self-hosted, Windows, udt]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}

      - name: Restore solution
        shell: pwsh
        run: dotnet restore UniversalDeviceToolkit.sln --locked-mode

      - name: Build main app
        shell: pwsh
        run: dotnet build UniversalDeviceToolkit.WPF/UniversalDeviceToolkit.WPF.csproj --configuration Release --no-restore /p:EnableUdtTestHooks=true

      - name: Build UI smoke tool
        shell: pwsh
        run: dotnet build Tools/MainAppPluginUi.Smoke/MainAppPluginUi.Smoke.csproj --configuration Release --no-restore

      - name: Validate local plugin package source
        shell: pwsh
        env:
          PLUGIN_IDS: ${{ inputs.plugin_ids }}
          PLUGIN_SOURCES: ${{ inputs.plugin_sources }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          $pluginInstallScenarios = [System.Collections.Generic.HashSet[string]]::new(
            [string[]]@('custom', 'shell-local', 'combo-local'),
            [System.StringComparer]::OrdinalIgnoreCase)
          if (-not $pluginInstallScenarios.Contains($env:SCENARIO)) {
            Write-Host "Scenario '$env:SCENARIO' does not install plugins; skipping local package validation."
            exit 0
          }

          function ConvertTo-PluginDirectoryName([string]$pluginId) {
            $segments = $pluginId.Split('-', [System.StringSplitOptions]::RemoveEmptyEntries)
            if ($segments.Count -eq 0) {
              return $pluginId
            }

            return ($segments | ForEach-Object {
              if ($_.Length -le 1) {
                $_.ToUpperInvariant()
              }
              else {
                $_.Substring(0, 1).ToUpperInvariant() + $_.Substring(1)
              }
            }) -join ''
          }

          $requestedLocalPlugins = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $pluginIds = @($env:PLUGIN_IDS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $explicitSources = @{}
          $wildcardSource = $null

          foreach ($entry in @($env:PLUGIN_SOURCES -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })) {
            $parts = $entry.Split('=', 2)
            if ($parts.Count -ne 2) {
              throw "Invalid plugin source entry '$entry'. Expected '<pluginId>=online|local'."
            }

            $key = $parts[0].Trim()
            $value = $parts[1].Trim().ToLowerInvariant()
            if ($value -ne 'online' -and $value -ne 'local') {
              throw "Invalid plugin source value '$value' for '$key'."
            }

            if ($key -eq '*') {
              $wildcardSource = $value
            }
            else {
              $explicitSources[$key] = $value
            }
          }

          foreach ($pluginId in $pluginIds) {
            $resolvedSource = if ($explicitSources.ContainsKey($pluginId)) {
              $explicitSources[$pluginId]
            }
            elseif ($null -ne $wildcardSource) {
              $wildcardSource
            }
            else {
              'online'
            }

            if ($resolvedSource -eq 'local') {
              [void]$requestedLocalPlugins.Add($pluginId)
            }
          }

          if ($requestedLocalPlugins.Count -eq 0) {
            Write-Host 'No local plugin ZIP scenarios requested; skipping local package validation.'
            exit 0
          }

          $sourceCandidates = @(
            (Join-Path $PWD 'Build\plugins'),
            (Join-Path $PWD '..\UniversalDeviceToolkit-Plugins\Build\plugins'),
            (Join-Path $PWD '..\LenovoLegionToolkit-Plugins\Build\plugins')
          )
          $sourceRoot = $sourceCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $sourceRoot) {
            throw "Local smoke was requested for [$($requestedLocalPlugins -join ', ')], but no local plugin package source root exists. Provision Build/plugins before running local scenarios."
          }

          $missingDirectories = New-Object System.Collections.Generic.List[string]
          foreach ($pluginId in $requestedLocalPlugins) {
            $directoryCandidates = @(
              (Join-Path $sourceRoot $pluginId),
              (Join-Path $sourceRoot (ConvertTo-PluginDirectoryName $pluginId))
            ) | Select-Object -Unique

            if (-not ($directoryCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1)) {
              $missingDirectories.Add($pluginId)
            }
          }

          if ($missingDirectories.Count -gt 0) {
            throw "Local smoke was requested for [$($missingDirectories -join ', ')], but matching plugin build directories were not found under '$sourceRoot'."
          }

          Write-Host "Validated local plugin package source: $sourceRoot"

      - name: Run UI smoke in dedicated session
        shell: pwsh
        env:
          PLUGIN_IDS: ${{ inputs.plugin_ids }}
          PLUGIN_SOURCES: ${{ inputs.plugin_sources }}
          SCENARIO: ${{ inputs.scenario }}
          THEME: ${{ inputs.theme }}
          SCREENSHOT_MODE: ${{ inputs.screenshot_mode }}
          WATCH_MODE: ${{ inputs.watch }}
          STEP_DELAY_MS: ${{ inputs.step_delay_ms }}
          SUCCESS_HOLD_MS: ${{ inputs.success_hold_ms }}
          FAILURE_HOLD_MS: ${{ inputs.failure_hold_ms }}
          KEEP_ARTIFACTS: ${{ inputs.keep_artifacts }}
          POWER_MODE_HARDWARE_VERIFY: ${{ inputs.power_mode_hardware_verify }}
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP ("llt-main-app-ui-smoke-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          $scriptPath = Join-Path $PWD 'Tools\MainAppPluginUi.Smoke\Run-MainAppPluginUi.Smoke.ps1'
          $arguments = @{
            RepositoryRoot = $PWD
            PluginIds = $env:PLUGIN_IDS
            PluginSources = $env:PLUGIN_SOURCES
            Scenario = $env:SCENARIO
            Theme = $env:THEME
            ScreenshotMode = $env:SCREENSHOT_MODE
            ArtifactRoot = $artifactRoot
            Watch = [System.Convert]::ToBoolean($env:WATCH_MODE)
            StepDelayMs = [int]$env:STEP_DELAY_MS
            SuccessHoldMs = [int]$env:SUCCESS_HOLD_MS
            FailureHoldMs = [int]$env:FAILURE_HOLD_MS
            KeepArtifacts = [System.Convert]::ToBoolean($env:KEEP_ARTIFACTS)
            PowerModeHardwareVerify = [System.Convert]::ToBoolean($env:POWER_MODE_HARDWARE_VERIFY)
          }

          & $scriptPath @arguments

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Main App UI Smoke"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Scenario: ``$env:SCENARIO``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Plugins: ``$env:PLUGIN_IDS``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Sources: ``$env:PLUGIN_SOURCES``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Theme: ``$env:THEME``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Screenshot mode: ``$env:SCREENSHOT_MODE``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Watch mode: ``$env:WATCH_MODE``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Power-mode hardware verify: ``$env:POWER_MODE_HARDWARE_VERIFY``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Step delay: ``$env:STEP_DELAY_MS`` ms"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Artifact root: ``$artifactRoot``"

      - name: Upload UI smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-app-ui-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/llt-main-app-ui-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
