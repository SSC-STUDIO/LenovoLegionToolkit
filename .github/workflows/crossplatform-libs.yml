name: Cross-Platform Libraries Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} libraries
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}

      - name: Build Lib.Abstractions
        run: dotnet build UniversalDeviceToolkit.Lib.Abstractions/UniversalDeviceToolkit.Lib.Abstractions.csproj --configuration Release

      - name: Build Lib.Shared
        run: dotnet build UniversalDeviceToolkit.Lib.Shared/UniversalDeviceToolkit.Lib.Shared.csproj --configuration Release

      - name: Build Platform.Linux
        if: runner.os == 'Linux'
        run: dotnet build UniversalDeviceToolkit.Platform.Linux/UniversalDeviceToolkit.Platform.Linux.csproj --configuration Release

      - name: Build Platform.MacOS
        if: runner.os == 'macOS'
        run: dotnet build UniversalDeviceToolkit.Platform.MacOS/UniversalDeviceToolkit.Platform.MacOS.csproj --configuration Release

      - name: Build Platform.Windows
        if: runner.os == 'Windows'
        run: dotnet build UniversalDeviceToolkit.Platform.Windows/UniversalDeviceToolkit.Platform.Windows.csproj --configuration Release
