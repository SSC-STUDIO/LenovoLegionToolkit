name: UI Desktop Session

# Spin up a temporary interactive Windows desktop on a hosted runner,
# reachable via a free public bore.pub TCP tunnel (no account/token/client needed).
# Use it to run UI smoke manually, capture screenshots, or record promo footage.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Session length in minutes (max 350)
        required: false
        default: '120'
      build_run_id:
        description: Build.yml run id to pre-download release-assets from (empty = latest successful)
        required: false
        default: ''

jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Enable Remote Desktop
        shell: pwsh
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 0
          $pw = -join ((48..57)+(65..90)+(97..122) | Get-Random -Count 16 | ForEach-Object {[char]$_})
          net user runneradmin "$pw" | Out-Null
          "RDP_USER=runneradmin" | Out-File $env:GITHUB_ENV -Append
          "RDP_PASSWORD=$pw" | Out-File $env:GITHUB_ENV -Append
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- RDP user: ``runneradmin``  password: ``$pw``"

      - name: Install bore tunnel client
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\bore.zip"
          $rel = (Invoke-RestMethod 'https://api.github.com/repos/ekzhang/bore/releases/latest').tag_name
          Invoke-WebRequest "https://github.com/ekzhang/bore/releases/download/$rel/bore-x86_64-pc-windows-msvc.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\bore" -Force
          $boreExe = (Get-ChildItem "$env:RUNNER_TEMP\bore" -Recurse -Filter bore.exe | Select-Object -First 1).FullName
          "BORE_EXE=$boreExe" | Out-File $env:GITHUB_ENV -Append

      - name: Pre-download installer (optional)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          New-Item -ItemType Directory -Path C:\udt -Force | Out-Null
          $rid = $env:BUILD_RUN_ID
          if ([string]::IsNullOrWhiteSpace($rid)) {
            for ($i = 0; $i -lt 5 -and -not $rid; $i++) {
              $rid = (gh run list --repo ${{ github.repository }} --workflow Build.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>$null)
              if (-not $rid) { Start-Sleep -Seconds 10 }
            }
          }
          if ($rid) {
            gh run download $rid --repo ${{ github.repository }} --name release-assets --dir C:\udt 2>$null
            Get-ChildItem C:\udt -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 10 | ForEach-Object { Write-Host "staged: $($_.FullName)" }
          } else {
            Write-Host "no successful Build run found; skipping installer staging"
          }
          # Staging is best-effort: never fail the session over it.
          $global:LASTEXITCODE = 0
          exit 0

      - name: Start tunnel and hold session
        shell: pwsh
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          $log = "$env:RUNNER_TEMP\bore.log"
          $endpoint = $null
          foreach ($attempt in 1..3) {
            $proc = Start-Process -FilePath $env:BORE_EXE -ArgumentList 'local','3389','--to','bore.pub' -PassThru -WindowStyle Hidden -RedirectStandardOutput $log -RedirectStandardError "$log.err"
            for ($i = 0; $i -lt 30 -and -not $endpoint; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path $log) {
                $m = Select-String -Path $log -Pattern 'bore\.pub:\d+' | Select-Object -First 1
                if ($m) { $endpoint = $m.Matches[0].Value }
              }
            }
            if ($endpoint) { break }
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Remove-Item $log -Force -ErrorAction SilentlyContinue
            Write-Host "bore attempt $attempt produced no endpoint; retrying"
          }
          if (-not $endpoint) { Get-Content $log -ErrorAction SilentlyContinue; Get-Content "$log.err" -ErrorAction SilentlyContinue; throw 'bore did not produce a public endpoint' }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## RDP session ready`n- Public endpoint: ``$endpoint```n- User: ``$env:RDP_USER```n- Password: ``$env:RDP_PASSWORD```n`nPoint any RDP client directly at ``$endpoint`` (no client-side tunnel needed)."
          Write-Host "RDP_ENDPOINT=$endpoint"
          Write-Host "RDP user: $env:RDP_USER  password: $env:RDP_PASSWORD"
          Write-Host "::notice title=RDP-READY::endpoint=$endpoint user=$env:RDP_USER password=$env:RDP_PASSWORD"
          Write-Host "Holding session for $env:MINUTES minutes..."
          Start-Sleep -Seconds ([int]$env:MINUTES * 60)
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
