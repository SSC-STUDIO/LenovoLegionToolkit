name: Windows CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

jobs:
  build-and-test-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet packages
        run: dotnet restore --locked-mode

      - name: Build Debug configuration
        run: dotnet build --configuration Debug --no-restore -warnaserror -v:minimal

      - name: Build Release configuration
        run: dotnet build --configuration Release --no-restore -warnaserror -v:minimal

      - name: Run test suite
        run: dotnet test --configuration Debug --no-build --verbosity normal --logger "trx;LogFileName=TestResults/windows-test-results.xml"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults/*.xml

      - name: Summarize test results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $resultFiles = @(Get-ChildItem -Path . -Recurse -File -Filter 'windows-test-results.xml')
          if ($resultFiles.Count -eq 0) {
            Write-Warning 'No Windows test result files were found.'
            return
          }

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### Windows test results'
          foreach ($resultFile in $resultFiles) {
            [xml]$testRun = Get-Content -LiteralPath $resultFile.FullName -Raw
            $counters = $testRun.TestRun.ResultSummary.Counters
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- `{0}`: total {1}, passed {2}, failed {3}, skipped {4}" -f $resultFile.FullName, $counters.total, $counters.passed, $counters.failed, $counters.notExecuted)
          }
