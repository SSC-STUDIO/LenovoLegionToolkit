name: Avalonia Multi-Platform Build

on:
  push:
    branches: [master]
    paths:
      - 'UniversalDeviceToolkit.Avalonia/**'
      - 'UniversalDeviceToolkit.Lib.Abstractions/**'
      - 'UniversalDeviceToolkit.Lib.Shared/**'
      - 'UniversalDeviceToolkit.ViewModels/**'
      - 'UniversalDeviceToolkit.Platform.Windows/**'
      - 'UniversalDeviceToolkit.Platform.Windows.Core/**'
      - 'UniversalDeviceToolkit.Platform.Linux/**'
      - 'UniversalDeviceToolkit.Platform.MacOS/**'
      - 'resources/device-packs.json'
      - '.github/workflows/avalonia-build.yml'
  pull_request:
    branches: [master]
    paths:
      - 'UniversalDeviceToolkit.Avalonia/**'
      - 'UniversalDeviceToolkit.Lib.Abstractions/**'
      - 'UniversalDeviceToolkit.Lib.Shared/**'
      - 'UniversalDeviceToolkit.ViewModels/**'
      - 'UniversalDeviceToolkit.Platform.Windows/**'
      - 'UniversalDeviceToolkit.Platform.Windows.Core/**'
      - 'UniversalDeviceToolkit.Platform.Linux/**'
      - 'UniversalDeviceToolkit.Platform.MacOS/**'
      - 'resources/device-packs.json'
      - '.github/workflows/avalonia-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} Avalonia (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            artifact: udt-avalonia-win-x64
          - os: ubuntu-latest
            runtime: linux-x64
            artifact: udt-avalonia-linux-x64
          - os: macos-14
            runtime: osx-arm64
            artifact: udt-avalonia-osx-arm64
          - os: macos-13
            runtime: osx-x64
            artifact: udt-avalonia-osx-x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}

      - name: Restore dependencies
        run: dotnet restore UniversalDeviceToolkit.Avalonia/UniversalDeviceToolkit.Avalonia.csproj

      - name: Build cross-platform libraries
        run: |
          dotnet build UniversalDeviceToolkit.Lib.Abstractions/UniversalDeviceToolkit.Lib.Abstractions.csproj --configuration Release --no-restore
          dotnet build UniversalDeviceToolkit.Lib.Shared/UniversalDeviceToolkit.Lib.Shared.csproj --configuration Release --no-restore
          dotnet build UniversalDeviceToolkit.ViewModels/UniversalDeviceToolkit.ViewModels.csproj --configuration Release --no-restore

      - name: Build Avalonia application
        run: dotnet publish UniversalDeviceToolkit.Avalonia/UniversalDeviceToolkit.Avalonia.csproj --configuration Release --runtime ${{ matrix.runtime }} --self-contained false --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ./publish/
          retention-days: 14
          if-no-files-found: warn
