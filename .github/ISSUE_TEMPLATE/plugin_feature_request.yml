name: Feature Request
description: Suggest a new feature or plugin idea
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type of request
      options:
        - New plugin idea
        - Enhancement to existing plugin
        - SDK / tooling improvement
        - Documentation improvement
    validations:
      required: true

  - type: input
    id: plugin
    attributes:
      label: Plugin name (if applicable)
      description: "Which plugin does this relate to? Leave blank if it's a new plugin idea."
      placeholder: "e.g., Cursor & Pointer (custom-mouse)"

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point or missing capability.
      placeholder: "I wish I could..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe your ideal solution
      description: How should this feature work?
      placeholder: "It would be great if..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you tried any workarounds?
      placeholder: "Optional"
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to contribute this feature myself (with guidance).
          required: false
