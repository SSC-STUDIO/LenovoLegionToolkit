name: Publish Plugin Catalog

on:
  workflow_dispatch:
    inputs:
      plugin_ids:
        description: 'Comma-separated plugin ids to publish'
        required: true
        default: 'custom-mouse,shell-integration,vive-tool'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CATALOG_RELEASE_TAG: plugin-catalog
      CATALOG_RELEASE_URL: https://github.com/SSC-STUDIO/UniversalDeviceToolkit/releases/download/plugin-catalog

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Prepare generated directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\Plugins\.build\catalog, .\Plugins\.build\release-assets -Force | Out-Null
          gh release download $env:CATALOG_RELEASE_TAG `
            --repo "${{ github.repository }}" `
            --pattern plugin-catalog.json `
            --dir .\Plugins\.build\catalog `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'No existing plugin catalog release found; generating a new catalog.'
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate official plugins
        shell: pwsh
        run: |
          .\Plugins\Scripts\Invoke-PluginTooling.ps1 `
            validate `
            --repository-root .\Plugins `
            --plugin-ids "${{ github.event.inputs.plugin_ids }}" `
            --profile official-release

      - name: Build and package selected plugins
        shell: pwsh
        run: |
          $pluginIds = "${{ github.event.inputs.plugin_ids }}".Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          foreach ($pluginId in $pluginIds) {
            .\Plugins\Scripts\Invoke-PluginTooling.ps1 build --repository-root .\Plugins --plugin $pluginId
            .\Plugins\Scripts\Invoke-PluginTooling.ps1 package --repository-root .\Plugins --plugin $pluginId --output-dir .\Plugins\.build\release-assets
          }

      - name: Generate plugin catalog
        shell: pwsh
        run: |
          .\Plugins\Scripts\Invoke-PluginTooling.ps1 `
            generate-store `
            --repository-root .\Plugins `
            --plugin-ids "${{ github.event.inputs.plugin_ids }}" `
            --asset-root .\Plugins\.build\release-assets `
            --output .\Plugins\.build\catalog\plugin-catalog.json `
            --release-repository-url $env:CATALOG_RELEASE_URL `
            --merge-existing `
            --require-assets

      - name: Ensure rolling catalog release exists
        shell: pwsh
        run: |
          gh release view $env:CATALOG_RELEASE_TAG --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:CATALOG_RELEASE_TAG `
              --repo "${{ github.repository }}" `
              --title 'Universal Device Toolkit Plugins' `
              --notes 'Rolling release containing the current official plugin catalog and packages.' `
              --latest=false
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace selected package assets
        shell: pwsh
        run: |
          $pluginIds = "${{ github.event.inputs.plugin_ids }}".Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          $release = gh release view $env:CATALOG_RELEASE_TAG --repo "${{ github.repository }}" --json assets | ConvertFrom-Json
          foreach ($pluginId in $pluginIds) {
            $newAsset = Get-ChildItem .\Plugins\.build\release-assets "$pluginId-v*.zip" | Select-Object -First 1
            if (-not $newAsset) { throw "Package asset for '$pluginId' was not generated." }

            foreach ($oldAsset in $release.assets | Where-Object { $_.name -like "$pluginId-v*.zip" -and $_.name -ne $newAsset.Name }) {
              gh release delete-asset $env:CATALOG_RELEASE_TAG $oldAsset.name --repo "${{ github.repository }}" --yes
            }

            gh release upload $env:CATALOG_RELEASE_TAG $newAsset.FullName --repo "${{ github.repository }}" --clobber
          }

          gh release upload $env:CATALOG_RELEASE_TAG `
            .\Plugins\.build\catalog\plugin-catalog.json `
            --repo "${{ github.repository }}" `
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
