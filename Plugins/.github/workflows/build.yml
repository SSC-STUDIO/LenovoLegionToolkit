name: Build Plugins

on:
  push:
    branches: [main, master]
    paths:
      - 'Plugins/**'
      - 'SDK/**'
      - 'Scripts/**'
      - 'Dependencies/**'
      - 'store.json'
      - 'Directory.Build.props'
      - '.github/workflows/build.yml'
      - '!Plugins/**/obj/**'
      - '!Plugins/**/bin/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'Plugins/**'
      - 'SDK/**'
      - 'Scripts/**'
      - 'Dependencies/**'
      - 'store.json'
      - 'Directory.Build.props'
      - '.github/workflows/build.yml'
      - '!Plugins/**/obj/**'
      - '!Plugins/**/bin/**'
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Specific plugin to build (leave empty for all)'
        required: false
        default: ''
      version:
        description: 'Optional validation for a single-plugin release; must match plugin.json version'
        required: false
        default: ''

env:
  PLUGIN_REPO: ${{ github.repository }}

permissions:
  contents: read
  actions: read
  attestations: read
  checks: read
  deployments: read
  id-token: none
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read

jobs:
  validate-completion:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      - name: Validate published store metadata
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $storePath = Join-Path $PWD 'store.json'
          $store = Get-Content $storePath -Raw | ConvertFrom-Json -AsHashtable

          foreach ($plugin in @($store.plugins)) {
            $pluginId = [string]$plugin.id
            $pluginVersion = [string]$plugin.version
            $downloadUrl = [string]$plugin.downloadUrl
            $changelogUrl = [string]$plugin.changelog

            if (-not $pluginId) {
              throw "store.json contains a plugin entry without an id."
            }

            if (-not $pluginVersion) {
              throw "store.json entry '$pluginId' is missing version metadata."
            }

            $expectedTagName = "$pluginId-v$pluginVersion"
            $expectedAssetName = "$expectedTagName.zip"

            $release = gh api "repos/${{ env.PLUGIN_REPO }}/releases/tags/$expectedTagName" | ConvertFrom-Json -AsHashtable
            if ($LASTEXITCODE -ne 0) {
              throw "store.json entry '$pluginId' points at missing release '$expectedTagName'."
            }

            $asset = @($release.assets) | Where-Object { $_.name -eq $expectedAssetName } | Select-Object -First 1
            if (-not $asset) {
              throw "Release '$expectedTagName' does not contain expected asset '$expectedAssetName'."
            }

            if ([string]$asset.state -ne 'uploaded') {
              throw "Release asset '$expectedAssetName' for '$expectedTagName' is not uploaded."
            }

            if ([string]$asset.browser_download_url -ne $downloadUrl) {
              throw "store.json downloadUrl mismatch for '$pluginId'. Expected '$([string]$asset.browser_download_url)', found '$downloadUrl'."
            }

            if ([string]$release.html_url -ne $changelogUrl) {
              throw "store.json changelog mismatch for '$pluginId'. Expected '$([string]$release.html_url)', found '$changelogUrl'."
            }
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Run plugin completion checker
        shell: pwsh
        run: |
          $reportPath = "artifacts/plugin-completion-report.json"
          $pluginInput = "${{ github.event.inputs.plugin }}"
          if ($pluginInput) {
            $pluginIds = $pluginInput.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ }
            & .\Scripts\plugin-completion-check.ps1 -PluginIds $pluginIds -JsonReportPath $reportPath
          } else {
            & .\Scripts\plugin-completion-check.ps1 -JsonReportPath $reportPath
          }

      - name: Upload plugin completion report
        uses: actions/upload-artifact@v7.0.0
        with:
          name: plugin-completion-report
          path: artifacts/plugin-completion-report.json
          if-no-files-found: error
          retention-days: 7

  build:
    needs: validate-completion
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Determine which plugins to build
        id: determine-plugins
        shell: pwsh
        run: |
          $input = "${{ github.event.inputs.plugin }}"
          if ($input) {
            Write-Host "Building specific plugin: $input"
            Write-Host "plugins=$input" >> $env:GITHUB_OUTPUT
          } else {
            $plugins = Get-ChildItem -Path Plugins -Directory -Name | Where-Object { $_ -ne 'Template' -and $_ -ne 'Shared' -and $_ -notlike '*.Tests' }
            $pluginsStr = $plugins -join ","
            Write-Host "Building all plugins: $pluginsStr"
            Write-Host "plugins=$pluginsStr" >> $env:GITHUB_OUTPUT
          }

      - name: Build plugins
        shell: pwsh
        run: |
          $plugins = "${{ steps.determine-plugins.outputs.plugins }}".Split(',')
          foreach ($plugin in $plugins) {
            $plugin = $plugin.Trim()
            if (-not $plugin) { continue }
            
            $csproj = Get-ChildItem -Path "Plugins/$plugin" -Filter *.csproj -Recurse | Select-Object -First 1
            if ($csproj) {
              Write-Host "Building $plugin..."
              dotnet build $csproj.FullName -c Release --nologo -v q
              if ($LASTEXITCODE -ne 0) {
                Write-Error "Failed to build $plugin"
                exit 1
              }
              Write-Host "Successfully built $plugin"
            } else {
              Write-Warning "No csproj found for $plugin"
            }
          }

      - name: Create ZIP packages
        shell: pwsh
        run: |
          $selectedPlugins = "${{ steps.determine-plugins.outputs.plugins }}".Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          $requestedVersion = "${{ github.event.inputs.version }}".Trim()
          $artifactDir = Join-Path $PWD "Build/artifacts"

          if (Test-Path $artifactDir) {
            Remove-Item $artifactDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          if ($requestedVersion -and $selectedPlugins.Count -ne 1) {
            throw "version input is only supported when building a single plugin."
          }

          foreach ($plugin in $selectedPlugins) {
            $plugin = $plugin.Trim()
            if (-not $plugin) { continue }
            
            $pluginDir = "Plugins/$plugin"
            $pluginJson = Join-Path $pluginDir "plugin.json"
            if (-not (Test-Path $pluginJson)) {
              throw "Missing plugin.json for $plugin"
            }

            $pluginManifest = Get-Content $pluginJson -Raw | ConvertFrom-Json
            $pluginId = [string]$pluginManifest.id
            $pluginVersion = [string]$pluginManifest.version

            if (-not $pluginId) {
              throw "Missing plugin id for $plugin"
            }

            if (-not $pluginVersion) {
              throw "Missing plugin version for $plugin"
            }

            if ($requestedVersion -and $pluginVersion -ne $requestedVersion) {
              throw "Requested version '$requestedVersion' does not match $plugin id version '$pluginVersion'."
            }

            $buildDir = "Build/plugins/LenovoLegionToolkit.Plugins.$plugin"
            if (-not (Test-Path $buildDir)) {
              throw "Expected build output not found for $plugin at $buildDir"
            }
            
            $zipName = "$pluginId-v$pluginVersion.zip"
            $zipPath = Join-Path $artifactDir $zipName
            
            # Package the actual compiled plugin output so DLLs/resources stay in sync.
            Compress-Archive -Path "$buildDir/*" -DestinationPath $zipPath -Force
            Write-Host "Created $zipPath"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.0
        with:
          name: plugin-zips
          path: Build/artifacts/*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: plugin-zips
          path: .

      - name: Publish per-plugin releases
        shell: pwsh
        run: |
          $zips = Get-ChildItem *.zip
          if (-not $zips) {
            throw "No ZIP artifacts found for release publishing."
          }

          foreach ($zip in $zips) {
            $tagName = $zip.BaseName

            gh release view $tagName --repo "${{ env.PLUGIN_REPO }}" *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tagName $zip.FullName --repo "${{ env.PLUGIN_REPO }}" --clobber
            } else {
              gh release create $tagName $zip.FullName --repo "${{ env.PLUGIN_REPO }}" --title $tagName --generate-notes
            }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-store-json:
    needs: release
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: plugin-zips
          path: .

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Generate store.json
        shell: pwsh
        run: |
          $storePath = Join-Path $PWD "store.json"
          $existingStore = Get-Content $storePath -Raw | ConvertFrom-Json -AsHashtable
          $existingPlugins = @{}
          foreach ($plugin in $existingStore.plugins) {
            $existingPlugins[$plugin.id] = $plugin
          }

          $requestedPlugins = "${{ github.event.inputs.plugin }}".Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          if (-not $requestedPlugins) {
            $requestedPlugins = Get-ChildItem -Path Plugins -Directory -Name | Where-Object { $_ -ne 'Template' -and $_ -notlike '*.Tests' }
          }

          $releaseDate = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")

          foreach ($pluginFolder in $requestedPlugins) {
            $pluginJsonPath = Join-Path (Join-Path $PWD "Plugins\$pluginFolder") "plugin.json"
            if (-not (Test-Path $pluginJsonPath)) {
              throw "Missing plugin.json for $pluginFolder"
            }

            $pluginManifest = Get-Content $pluginJsonPath -Raw | ConvertFrom-Json -AsHashtable
            $pluginId = [string]$pluginManifest.id
            $pluginVersion = [string]$pluginManifest.version
            $expectedZipName = "$pluginId-v$pluginVersion.zip"
            $zipPath = Join-Path $PWD $expectedZipName

            if (-not (Test-Path $zipPath)) {
              throw "Missing ZIP artifact for $pluginId at $expectedZipName"
            }

            $zipItem = Get-Item $zipPath
            $existingPlugin = $existingPlugins[$pluginId]

            $updatedPlugin = [ordered]@{
              id = $pluginId
              name = if ($existingPlugin) { $existingPlugin.name } else { [string]$pluginManifest.name }
              version = $pluginVersion
              description = if ($existingPlugin) { $existingPlugin.description } else { "" }
              author = if ($existingPlugin) { $existingPlugin.author } else { [string]$pluginManifest.author }
              repositoryUrl = if ($existingPlugin) { $existingPlugin.repositoryUrl } else { [string]$pluginManifest.repository }
              downloadUrl = "https://github.com/${{ env.PLUGIN_REPO }}/releases/download/$pluginId-v$pluginVersion/$expectedZipName"
              changelog = "https://github.com/${{ env.PLUGIN_REPO }}/releases/tag/$pluginId-v$pluginVersion"
              icon = if ($existingPlugin -and $existingPlugin.ContainsKey("icon")) { $existingPlugin.icon } else { "" }
              iconBackground = if ($existingPlugin) { $existingPlugin.iconBackground } else { "" }
              isSystemPlugin = [bool]$pluginManifest.isSystemPlugin
              dependencies = if ($existingPlugin) { @($existingPlugin.dependencies) } else { @() }
              minLLTVersion = [string]$pluginManifest.minLLTVersion
              releaseDate = $releaseDate
              fileSize = [int]$zipItem.Length
              tags = if ($existingPlugin) { @($existingPlugin.tags) } else { @() }
              supportedLanguages = if ($existingPlugin) { @($existingPlugin.supportedLanguages) } else { @("en") }
            }

            $existingPlugins[$pluginId] = $updatedPlugin
          }

          $orderedPlugins = foreach ($plugin in $existingStore.plugins) {
            $pluginId = [string]$plugin.id
            if ($existingPlugins.ContainsKey($pluginId)) {
              $existingPlugins[$pluginId]
            }
          }

          $newPlugins = foreach ($pluginId in $existingPlugins.Keys) {
            if ($existingStore.plugins.id -notcontains $pluginId) {
              $existingPlugins[$pluginId]
            }
          }

          $storeVersion = if ($existingStore.ContainsKey("storeVersion")) {
            [string]$existingStore.storeVersion
          } elseif ($existingStore.ContainsKey("version")) {
            [string]$existingStore.version
          } else {
            "1.0.0"
          }

          $store = [ordered]@{
            plugins = @($orderedPlugins + ($newPlugins | Sort-Object id))
            lastUpdated = $releaseDate
            storeVersion = $storeVersion
            version = $storeVersion
          }

          $store | ConvertTo-Json -Depth 10 | Out-File store.json -Encoding utf8
          Get-Content store.json

      - name: Commit store.json update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add store.json
          git commit -m "Update store.json for release v${{ github.event.inputs.version }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
