<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Nilesoft Shell Manager</title>
  <link rel="stylesheet" href="plugin-ui.css" />
</head>
<body>
  <h1 class="up-title" data-i18n="title">Nilesoft Shell Manager</h1>
  <p class="up-subtitle" data-i18n="subtitle">Register Nilesoft Shell and sync the UDT-managed configuration.</p>

  <div class="up-card">
    <div class="up-card__title" data-i18n="status">Status</div>
    <div class="up-row">
      <span class="up-row__label" data-i18n="installed">Installed</span>
      <span id="installed" class="up-badge">—</span>
    </div>
    <div class="up-row">
      <span class="up-row__label" data-i18n="registered">Registered</span>
      <span id="registered" class="up-badge">—</span>
    </div>
    <div class="up-row">
      <span class="up-row__label" data-i18n="version">Version</span>
      <span id="version" class="up-mono">—</span>
    </div>
    <div class="up-row">
      <span class="up-row__label" data-i18n="path">Install path</span>
      <span id="path" class="up-mono">—</span>
    </div>
    <div class="up-row">
      <span class="up-row__label" data-i18n="toggle">Shell integration</span>
      <div class="up-actions">
        <button id="enable" class="up-btn up-btn--primary" data-i18n="enable">Enable</button>
        <button id="disable" class="up-btn up-btn--danger" data-i18n="disable">Disable</button>
      </div>
    </div>
  </div>

  <div class="up-card">
    <div class="up-card__title" data-i18n="config">Configuration</div>
    <div class="up-row">
      <span class="up-row__label" data-i18n="preset">Preset</span>
      <select id="preset" class="up-select">
        <option value="Default" data-i18n="presetDefault">Default</option>
        <option value="CompactDark" data-i18n="presetDark">Compact dark</option>
        <option value="MinimalLight" data-i18n="presetLight">Minimal light</option>
      </select>
      <button id="apply-preset" class="up-btn" data-i18n="applyPreset">Apply preset</button>
    </div>
    <div class="up-row">
      <span class="up-row__label" data-i18n="open">Open</span>
      <div class="up-actions">
        <button id="open-folder" class="up-btn" data-i18n="openFolder">Folder</button>
        <button id="open-config" class="up-btn" data-i18n="openConfig">Config file</button>
        <button id="open-managed" class="up-btn" data-i18n="openManaged">Managed folder</button>
      </div>
    </div>
    <div class="up-row">
      <span class="up-row__label" data-i18n="managed">Managed config</span>
      <div class="up-actions">
        <button id="sync" class="up-btn" data-i18n="sync">Sync</button>
        <button id="reset" class="up-btn up-btn--danger" data-i18n="reset">Reset</button>
        <button id="export" class="up-btn" data-i18n="export">Export</button>
        <button id="import" class="up-btn" data-i18n="import">Import</button>
      </div>
    </div>
  </div>

  <p id="status" class="up-status">—</p>

  <script>
    const zh = (navigator.language || '').toLowerCase().startsWith('zh')
    const copy = {
      title: ['Nilesoft Shell Manager', 'Nilesoft Shell 管理器'],
      subtitle: ['Register Nilesoft Shell and sync the UDT-managed configuration.', '注册 Nilesoft Shell 并同步 UDT 托管配置。'],
      status: ['Status', '状态'],
      installed: ['Installed', '已安装'],
      registered: ['Registered', '已注册'],
      version: ['Version', '版本'],
      path: ['Install path', '安装路径'],
      toggle: ['Shell integration', 'Shell 集成'],
      enable: ['Enable', '启用'],
      disable: ['Disable', '禁用'],
      config: ['Configuration', '配置'],
      preset: ['Preset', '预设'],
      presetDefault: ['Default', '默认'],
      presetDark: ['Compact dark', '紧凑深色'],
      presetLight: ['Minimal light', '极简浅色'],
      applyPreset: ['Apply preset', '应用预设'],
      open: ['Open', '打开'],
      openFolder: ['Folder', '文件夹'],
      openConfig: ['Config file', '配置文件'],
      openManaged: ['Managed folder', '托管目录'],
      managed: ['Managed config', '托管配置'],
      sync: ['Sync', '同步'],
      reset: ['Reset', '重置'],
      export: ['Export', '导出'],
      import: ['Import', '导入']
    }
    for (const node of document.querySelectorAll('[data-i18n]')) {
      const key = node.getAttribute('data-i18n')
      const pair = copy[key]
      if (pair) node.textContent = zh ? pair[1] : pair[0]
    }

    const bridge = window.pluginHost
    const status = document.getElementById('status')
    const yes = zh ? '是' : 'Yes'
    const no = zh ? '否' : 'No'

    function setStatus(text, isError) {
      status.textContent = text
      status.style.color = isError ? 'var(--up-danger)' : ''
    }

    function applyStatus(data) {
      document.getElementById('installed').textContent = data.installed ? yes : no
      document.getElementById('registered').textContent = data.registered ? yes : no
      document.getElementById('version').textContent = data.version || '—'
      document.getElementById('path').textContent = data.installPath || data.folderPath || '—'
    }

    async function refresh() {
      const data = await bridge.invoke('plugin.shell.getStatus', {})
      applyStatus(data)
    }

    async function run(method, params) {
      try {
        const result = await bridge.invoke(method, params || {})
        await refresh()
        setStatus(result && result.ok === false ? (zh ? '失败' : 'Failed') : (zh ? '完成' : 'Done'), result && result.ok === false)
      } catch (error) {
        setStatus(error.message, true)
      }
    }

    document.getElementById('enable').addEventListener('click', () => void run('plugin.shell.enable'))
    document.getElementById('disable').addEventListener('click', () => void run('plugin.shell.disable'))
    document.getElementById('open-folder').addEventListener('click', () => void run('plugin.shell.openFolder'))
    document.getElementById('open-config').addEventListener('click', () => void run('plugin.shell.openConfig'))
    document.getElementById('open-managed').addEventListener('click', () => void run('plugin.shell.openManagedConfig'))
    document.getElementById('sync').addEventListener('click', () => void run('plugin.shell.syncManagedConfig'))
    document.getElementById('reset').addEventListener('click', () => void run('plugin.shell.resetManagedConfig'))
    document.getElementById('apply-preset').addEventListener('click', () => {
      void run('plugin.shell.applyPreset', { preset: document.getElementById('preset').value })
    })

    document.getElementById('export').addEventListener('click', async () => {
      try {
        const path = await bridge.invoke('dialog:save-file', {
          title: zh ? '导出 Shell 配置' : 'Export Shell profile',
          filters: [{ name: 'JSON', extensions: ['json'] }]
        })
        if (!path) return
        await run('plugin.shell.exportProfile', { path })
      } catch (error) {
        setStatus(error.message, true)
      }
    })

    document.getElementById('import').addEventListener('click', async () => {
      try {
        const path = await bridge.invoke('dialog:open-file', {
          title: zh ? '导入 Shell 配置' : 'Import Shell profile',
          filters: [{ name: 'JSON', extensions: ['json'] }]
        })
        if (!path) return
        await run('plugin.shell.importProfile', { path })
      } catch (error) {
        setStatus(error.message, true)
      }
    })

    refresh().then(() => setStatus(zh ? '已加载' : 'Loaded')).catch((error) => setStatus(error.message, true))
  </script>
</body>
</html>
