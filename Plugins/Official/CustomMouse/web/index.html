<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
  <title>Cursor &amp; Pointer</title>
  <link rel="stylesheet" href="./plugin-ui.css" />
</head>
<body>
  <h1 class="up-title" data-i18n="title">Cursor &amp; Pointer</h1>
  <p class="up-subtitle" data-i18n="subtitle">Pointer speed, button swap, and theme-aware cursor styles.</p>

  <div class="up-card">
    <div class="up-card__title" data-i18n="windows">Windows pointer</div>
    <div class="up-row">
      <span class="up-row__label">
        <span data-i18n="speed">Pointer speed</span>
        <span class="up-row__desc" data-i18n="speedDesc">Range 1–20 (Windows SPI)</span>
      </span>
      <input id="speed" class="up-range" type="range" min="1" max="20" value="10" />
      <span id="speed-value" class="up-mono">10</span>
    </div>
    <div class="up-row">
      <span class="up-row__label">
        <span data-i18n="swap">Swap primary buttons</span>
        <span class="up-row__desc" data-i18n="swapDesc">Left-handed mouse layout</span>
      </span>
      <label class="up-switch"><input id="swap" type="checkbox" /><span class="up-switch__track"></span></label>
    </div>
    <div class="up-row">
      <span class="up-row__label" data-i18n="applyWindows">Apply pointer settings</span>
      <button id="apply-windows" class="up-btn up-btn--primary" data-i18n="apply">Apply</button>
    </div>
  </div>

  <div class="up-card">
    <div class="up-card__title" data-i18n="cursor">Cursor theme</div>
    <div class="up-row">
      <span class="up-row__label">
        <span data-i18n="mode">Theme mode</span>
        <span class="up-row__desc" data-i18n="modeDesc">Auto follows Windows light/dark</span>
      </span>
      <select id="mode" class="up-select">
        <option value="0" data-i18n="modeAuto">Auto</option>
        <option value="1" data-i18n="modeLight">Light</option>
        <option value="2" data-i18n="modeDark">Dark</option>
        <option value="3" data-i18n="modeDefault">Windows default</option>
      </select>
    </div>
    <div class="up-row">
      <span class="up-row__label" data-i18n="actions">Actions</span>
      <div class="up-actions">
        <button id="apply-theme" class="up-btn" data-i18n="applyNow">Apply now</button>
        <button id="sync" class="up-btn" data-i18n="sync">Sync from Windows</button>
        <button id="restore" class="up-btn up-btn--danger" data-i18n="restore">Restore default</button>
      </div>
    </div>
  </div>

  <p id="status" class="up-status">—</p>

  <script>
    const zh = (navigator.language || '').toLowerCase().startsWith('zh')
    const copy = {
      title: ['Cursor & Pointer', '光标与指针'],
      subtitle: ['Pointer speed, button swap, and theme-aware cursor styles.', '指针速度、主按键交换与主题感知光标。'],
      windows: ['Windows pointer', 'Windows 指针'],
      speed: ['Pointer speed', '指针速度'],
      speedDesc: ['Range 1–20 (Windows SPI)', '范围 1–20（Windows SPI）'],
      swap: ['Swap primary buttons', '交换主按键'],
      swapDesc: ['Left-handed mouse layout', '左手鼠标布局'],
      applyWindows: ['Apply pointer settings', '应用指针设置'],
      apply: ['Apply', '应用'],
      cursor: ['Cursor theme', '光标主题'],
      mode: ['Theme mode', '主题模式'],
      modeDesc: ['Auto follows Windows light/dark', '自动跟随 Windows 浅色/深色'],
      modeAuto: ['Auto', '自动'],
      modeLight: ['Light', '浅色'],
      modeDark: ['Dark', '深色'],
      modeDefault: ['Windows default', 'Windows 默认'],
      actions: ['Actions', '操作'],
      applyNow: ['Apply now', '立即应用'],
      sync: ['Sync from Windows', '从 Windows 同步'],
      restore: ['Restore default', '还原默认']
    }
    for (const node of document.querySelectorAll('[data-i18n]')) {
      const key = node.getAttribute('data-i18n')
      const pair = copy[key]
      if (pair) node.textContent = zh ? pair[1] : pair[0]
    }

    const bridge = window.pluginHost
    const status = document.getElementById('status')
    const speed = document.getElementById('speed')
    const speedValue = document.getElementById('speed-value')
    const swap = document.getElementById('swap')
    const mode = document.getElementById('mode')
    let busy = false

    function setStatus(text, isError) {
      status.textContent = text
      status.style.color = isError ? 'var(--up-danger)' : ''
    }

    function applyState(state) {
      if (!state) return
      speed.value = String(state.pointerSpeed ?? 10)
      speedValue.textContent = speed.value
      swap.checked = Boolean(state.swapButtons)
      mode.value = String(state.cursorThemeMode ?? 0)
    }

    function failed(result) {
      return Boolean(result && result.ok === false)
    }

    async function withBusy(action) {
      if (busy) return
      busy = true
      try {
        await action()
      } finally {
        busy = false
      }
    }

    speed.addEventListener('input', () => { speedValue.textContent = speed.value })

    async function load() {
      if (!bridge || typeof bridge.invoke !== 'function') {
        setStatus(zh ? '插件桥接不可用' : 'Plugin bridge unavailable', true)
        return
      }
      try {
        const state = await bridge.invoke('plugin.customMouse.getState', {})
        applyState(state)
        setStatus(zh ? '已加载' : 'Loaded')
      } catch (error) {
        setStatus((zh ? '加载失败：' : 'Load failed: ') + error.message, true)
      }
    }

    document.getElementById('apply-windows').addEventListener('click', () => void withBusy(async () => {
      try {
        const result = await bridge.invoke('plugin.customMouse.applyWindows', {
          speed: Number(speed.value),
          swapButtons: swap.checked
        })
        setStatus(failed(result) ? (zh ? '应用失败' : 'Apply failed') : (zh ? '已应用' : 'Applied'), failed(result))
      } catch (error) {
        setStatus(error.message, true)
      }
    }))

    mode.addEventListener('change', () => void withBusy(async () => {
      try {
        const result = await bridge.invoke('plugin.customMouse.setCursorThemeMode', { mode: Number(mode.value) })
        if (failed(result)) {
          await load()
          setStatus(zh ? '主题失败' : 'Theme failed', true)
          return
        }
        setStatus(zh ? '主题已更新' : 'Theme updated')
      } catch (error) {
        await load()
        setStatus(error.message, true)
      }
    }))

    document.getElementById('apply-theme').addEventListener('click', () => void withBusy(async () => {
      try {
        const selected = Number(mode.value)
        const result = selected === 0
          ? await bridge.invoke('plugin.customMouse.applyCursorThemeNow', {})
          : await bridge.invoke('plugin.customMouse.setCursorThemeMode', { mode: selected })
        if (failed(result)) {
          await load()
          setStatus(zh ? '主题失败' : 'Theme failed', true)
          return
        }
        setStatus(zh ? '已应用当前主题' : 'Applied current theme')
      } catch (error) {
        setStatus(error.message, true)
      }
    }))

    document.getElementById('sync').addEventListener('click', () => void withBusy(async () => {
      try {
        const state = await bridge.invoke('plugin.customMouse.syncFromWindows', {})
        applyState(state)
        setStatus(zh ? '已从 Windows 同步' : 'Synced from Windows')
      } catch (error) {
        setStatus(error.message, true)
      }
    }))

    document.getElementById('restore').addEventListener('click', () => void withBusy(async () => {
      try {
        const result = await bridge.invoke('plugin.customMouse.restoreWindowsDefault', {})
        await load()
        if (failed(result)) {
          setStatus(zh ? '还原失败' : 'Restore failed', true)
          return
        }
        setStatus(zh ? '已还原 Windows 默认光标' : 'Restored Windows default cursor')
      } catch (error) {
        setStatus(error.message, true)
      }
    }))

    void load()
  </script>
</body>
</html>
