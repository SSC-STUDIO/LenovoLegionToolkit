ShortDescription: Lightweight Windows device toolkit; full Lenovo hardware control plus basic mode on other PCs.
Description: Universal Device Toolkit (UDT) is a lightweight, open-source Windows utility. Supported Lenovo Legion, LOQ, and IdeaPad Gaming laptops get direct hardware controls (power modes, RGB, dGPU, battery, and more). Other Lenovo models and non-Lenovo PCs run in basic mode with plugins, system tools, and language/theme/update workflows. No background service, no telemetry. Legacy package ID SSC-STUDIO.LenovoLegionToolkit is retained for in-place upgrades from Lenovo Legion Toolkit.
